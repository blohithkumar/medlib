}

.card:hover{
transform:translateY(-3px);
}

.card:active{
transform:scale(.98);
}

.icon{
font-size:40px;
margin-bottom:10px;
}

.card h3{
font-size:17px;
}

.card p{
color:#5f6b73;

font-size:14px;
}

.section-title{
margin:25px 0 15px;
}

.topic-card{
background:white;
padding:20px;
border-radius:15px;
margin:14px 0;
box-shadow:0 3px 10px rgba(0,0,0,.06);

}

.topic-card:hover{

}

.topic-card p{
margin-top:8px;
color:#5f6b73;
}

.back-button{
border:none;
background:#087f8c;
color:white;
padding:14px 22px;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

.content-box{
background:white;
padding:22px;
border-radius:15px;

}

.content-box h3{
margin-bottom:10px;
}

.content-box p{
line-height:1.6;
color:#46545c;
}

footer{
margin-top:40px;
padding:25px;
background:#17202a;
color:white;
text-align:center;
