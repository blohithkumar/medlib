<title>MedLib — Medical Learning Library</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f8fb;
    color: #17202a;
}

header {
    background: linear-gradient(135deg, #087f8c, #075985);
    color: white;
    padding: 18px 5%;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 15px rgba(0,0,0,.15);
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #a7f3d0;
}

.search-box {
    width: 45%;
}

.search-box input {
    width: 100%;
    padding: 12px 18px;
    border: none;
    border-radius: 25px;
    outline: none;
    font-size: 15px;
}

.hero {
    max-width: 1200px;
    margin: 30px auto;
    padding: 45px 25px;
    border-radius: 20px;
    background: linear-gradient(135deg, #dff7f8, #e0f2fe);
    text-align: center;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.hero p {
    color: #475569;
    font-size: 17px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 0 20px 50px;
}

.section-title {
    margin: 35px 0 18px;
    font-size: 25px;
}

.course-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.course-card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    cursor: pointer;
    border: 1px solid #e2e8f0;
    transition: .2s;
    box-shadow: 0 3px 10px rgba(0,0,0,.04);
}

.course-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,0,0,.10);
}

.course-card .icon {
    font-size: 35px;
    margin-bottom: 12px;
}

.course-card h3 {
    margin-bottom: 8px;
}

.course-card p {
    color: #64748b;
    font-size: 14px;
}

#coursePage {
    display: none;
}

.back-btn {
    border: none;
    background: #e0f2fe;
    color: #075985;
    padding: 10px 17px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    margin-bottom: 20px;
}

.course-header {
    background: white;
    padding: 25px;
    border-radius: 18px;
    margin-bottom: 20px;
    border: 1px solid #e2e8f0;
}

.course-header h1 {
    color: #075985;
    margin-bottom: 8px;
}

.year-section {
    margin-bottom: 25px;
}

.year-title {
    background: #075985;
    color: white;
    padding: 15px 18px;
    border-radius: 12px 12px 0 0;
    font-size: 20px;
}

.subject-grid {
    background: white;
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    border-radius: 0 0 12px 12px;
}

.subject {
    border: 1px solid #e2e8f0;
    padding: 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
}

.subject:hover {
    border-color: #0891b2;
    background: #f0fdff;
}

.subject h4 {
    margin-bottom: 7px;
}

.subject small {
    color: #64748b;
}

#subjectPage {
    display: none;
}

.topic-container {
    background: white;
    padding: 25px;
    border-radius: 16px;
}

.topic-list {
    margin-top: 20px;
    display: grid;
    gap: 10px;
}

.topic {
    padding: 15px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
}

.topic strong {
    color: #075985;
}

footer {
    background: #0f172a;
    color: #cbd5e1;
    text-align: center;
    padding: 30px;
    margin-top: 50px;
}

.no-results {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

@media(max-width:700px) {
    .header-inner {
        flex-direction: column;
        align-items: stretch;
    }

    .search-box {
        width: 100%;
    }

    .hero h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

<section id="coursePage">

</section>


<section id="subjectPage">

    <div class="container">

        <button class="back-btn" onclick="goBackToCourse()">
            ← Back to Course
        </button>

        <div id="subjectContent"></div>

    </div>

</section>

</main>


<footer>

    <p>Learn. Understand. Remember.</p>

</footer>

/* =========================================================
   DISPLAY COURSES
========================================================= */

function displayCourses(list = courses) {

    const grid = document.getElementById("courseGrid");

    if(list.length === 0) {
        grid.innerHTML =
            `<div class="no-results">
                No courses found.
            </div>`;
        return;
    }

    grid.innerHTML = list.map(course => `

        <div class="course-card"
             onclick="openCourse('${course.id}')">

            <div class="icon">${course.icon}</div>

            <h3>${course.name}</h3>

            <p>${course.description}</p>

        </div>

    `).join("");
}


/* =========================================================
   SEARCH
========================================================= */

function searchCourses() {

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const filtered = courses.filter(course => {

        const courseText =
            course.name.toLowerCase() +
            " " +
            course.description.toLowerCase() +
            " " +
            Object.values(course.years)
                .flat()
                .join(" ")
                .toLowerCase();

        return courseText.includes(search);
    });

    displayCourses(filtered);
}


/* =========================================================
   OPEN COURSE
========================================================= */

let currentCourse = null;

function openCourse(courseId) {

    currentCourse =
        courses.find(c => c.id === courseId);

    if(!currentCourse) return;

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("subjectPage")
        .style.display = "none";

    document.getElementById("coursePage")
        .style.display = "block";

    document.getElementById("courseHeader")
        .innerHTML = `

            <h1>
                ${currentCourse.icon}
                ${currentCourse.name}
            </h1>

            <p>
                ${currentCourse.description}
            </p>

        `;

    renderYears();
}


/* =========================================================
   RENDER YEARS
========================================================= */

function renderYears() {

    const container =
        document.getElementById("yearsContainer");

    container.innerHTML = "";

    Object.entries(currentCourse.years)
        .forEach(([year, subjects]) => {

            const section =
                document.createElement("div");

            section.className = "year-section";

            section.innerHTML = `

                <div class="year-title">
                    ${year}
                </div>

                <div class="subject-grid">

                    ${subjects.map(subject => `

                        <div class="subject"
                             onclick="openSubject('${escapeText(subject)}')">

                            <h4>${subject}</h4>

                            <small>
                                View chapters →
                            </small>

                        </div>

                    `).join("")}

                </div>

            `;

            container.appendChild(section);
        });
}


/* =========================================================
   SUBJECT PAGE
========================================================= */

function openSubject(subjectName) {

    document.getElementById("coursePage")
        .style.display = "none";

    document.getElementById("subjectPage")
        .style.display = "block";

    const topics =
        topicTemplates[subjectName] ||
        generateTopics(subjectName);

    document.getElementById("subjectContent")
        .innerHTML = `

            <div class="topic-container">

                <h1>
                    ${subjectName}
                </h1>

                <p style="margin-top:8px;color:#64748b;">
                    ${currentCourse.name}
                </p>

                <div class="topic-list">

                    ${topics.map((topic,index) => `

                        <div class="topic">
                            <strong>
                                ${index + 1}. ${topic}
                            </strong>

                            <p style="
                                margin-top:6px;
                                color:#64748b;
                                font-size:14px;
                            ">
                                Notes • Textbook • MCQs •
                                Flashcards
                            </p>
                        </div>

                    `).join("")}

                </div>

            </div>
        `;
}


/* =========================================================
   BACK BUTTONS
========================================================= */

function showHome() {

    document.getElementById("coursePage")
        .style.display = "none";

    document.getElementById("subjectPage")
        .style.display = "none";

    document.getElementById("homePage")
        .style.display = "block";

    document.getElementById("searchInput").value = "";

    displayCourses();
}


function goBackToCourse() {

    document.getElementById("subjectPage")
        .style.display = "none";

    document.getElementById("coursePage")
        .style.display = "block";
}


/* =========================================================
   FALLBACK TOPICS
========================================================= */

function generateTopics(subject) {

    return [
        "Introduction to " + subject,
        "Basic Concepts",
        "Structure & Classification",
        "Normal Function",
        "Clinical Applications",
        "Common Disorders",
        "Diagnosis",
        "Management",
        "Important Clinical Cases",
        "MCQs & Revision"
    ];
}


/* =========================================================
   SECURITY HELPER
========================================================= */

function escapeText(text) {

    return text
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


/* =========================================================
   START MEDLIB
========================================================= */

displayCourses();
